# Nexus Chat App Vulnerability Scan (Okta-Protected)
#
# Architecture (discovered via Swagger & browser DevTools):
#   Frontend SPA:  https://isioaiffwwebuat06.azurewebsites.net  (React, serves HTML)
#   Backend API:   https://isioaiffwwebuat07.azurewebsites.net  (ASP.NET, Swagger at /swagger)
#   Chat endpoint: POST /api/Nexus/PromptOrchestrator           (streaming, used by UI)
#   Eval endpoint: POST /api/Nexus/PromptOrchestratorEval       (non-streaming, used here)
#
# IMPORTANT — Prompt format:
#   The Prompt field is NOT a plain string.  It must be a JSON-stringified object:
#     Prompt: '{"user_input_content":[{"type":"text","text":"..."}]}'
#   The backend parses this inner JSON; sending a bare string causes HTTP 500.
#
# IMPORTANT — Required headers:
#   - Authorization: Bearer <okta-token>      (injected by auth section)
#   - Content-Type: application/json          (injected automatically)
#   - Cookie: ARRAffinity=<value>             (Azure session pinning — copy from browser)
#   - Origin / Referer / User-Agent           (backend validates these)
#
# Usage:
#   1. Log in to Nexus via Okta in your browser
#   2. Open DevTools (F12) > Network tab
#   3. Copy the Authorization Bearer token from any API request
#   4. Copy the ARRAffinity cookie value from response headers
#   5. Export both:
#        export OKTA_TOKEN="eyJ..."
#        export NEXUS_COOKIE="ARRAffinity=<value>"
#   6. Run the scan:
#        make scan-nexus              # from backend/
#   7. For dry run first:
#        make scan-nexus-dry
#
# NOTE: Okta tokens expire after ~1 hour.

name: "nexus-scan-promptinjection"
description: "Scan Nexus chat app (Okta-protected) for prompt injection and MCP abuse"

# --- Okta authentication ---
# The token is read from the OKTA_TOKEN environment variable at runtime.
# NEVER hardcode tokens in this file.
auth:
  type: okta
  token_env: OKTA_TOKEN

defaults:
  preset: fast
  generations: 5
  continue_on_error: true

targets:
  - name: "nexus-uat"
    type: rest
    # Backend API is on *07*, NOT *06* (which is the frontend SPA).
    # Using PromptOrchestratorEval (non-streaming) -- better for automated scanning.
    endpoint: "https://isioaiffwwebuat07.azurewebsites.net/api/Nexus/PromptOrchestratorEval"
    # Auth header is injected automatically from the 'auth' section above.
    #
    # Request body (discovered from browser DevTools):
    #   ConversationId: int          (0 = new conversation)
    #   Prompt: JSON string          ({"user_input_content":[{"type":"text","text":"..."}]})
    #   Username: email string       (must be valid email — server validates)
    #   ClientTime: datetime         (ISO 8601)
    #   ClientTimeZone: string       (IANA timezone)
    #   ConversationMode: bool       (false = single-turn)
    #   ResponseMode: string         ("Thoroughly" = full response)
    #   IsWidgetOrigin: bool         (false = direct chat)
    # Cookie ($NEXUS_COOKIE) and User-Agent are injected automatically by the CLI.
    headers:
      Origin: "https://isioaiffwwebuat06.azurewebsites.net"
      Referer: "https://isioaiffwwebuat06.azurewebsites.net/"
    body_template: '{"ConversationId":0,"Prompt":"{\"user_input_content\":[{\"type\":\"text\",\"text\":\"$INPUT\"}]}","Username":"Inho.Choi@intusurg.com","ClientTime":"2026-01-01T00:00:00Z","ClientTimeZone":"America/Los_Angeles","ConversationMode":false,"ResponseMode":"Thoroughly","IsWidgetOrigin":false}'
    # Response JSON: the LLM response is at facts[0].content
    response_field: "$.facts[0].content"
    probes:
      - dan
      - encoding
      - promptinject
    generator_options:
      rest:
        request_timeout: 120

output:
  directory: "./hydra_reports/nexus"
  filename_pattern: "{name}_{date}"

automation:
  exit_code_policy: never

compare:
  enabled: false
  fail_on_regression: true
  regression_threshold: 3.0
