# Nexus Quick Smoke Test (~5 minutes)
#
# A minimal scan to verify the full pipeline works end-to-end:
#   auth → API call → response parse → probe evaluation → report
#
# Uses only 3 tiny probes (total ~10 prompts × 2 generations = ~20 API calls).
# At ~5-10 seconds per call, this should finish in under 5 minutes.
#
# Usage:
#   export OKTA_TOKEN="eyJ..."
#   export NEXUS_COOKIE="ARRAffinity=<value from browser DevTools>"
#   make scan-nexus-quick          # from backend/
#
# Once this passes, run the full scan:
#   make scan-nexus                # ~30-60 minutes

name: "nexus-quick-smoke"
description: "Quick smoke test — verify Nexus scan pipeline works (3 probes, ~5 min)"

auth:
  type: okta
  token_env: OKTA_TOKEN

defaults:
  preset: fast
  generations: 2
  continue_on_error: true

targets:
  - name: "nexus-uat"
    type: rest
    # Route through the local Nexus proxy (garak service port 9090) which
    # wraps the simple {"prompt":"..."} body into the nested JSON format
    # the Nexus API requires.  This avoids double-JSON-escaping issues
    # that break garak's naive $INPUT substitution.
    endpoint: "http://localhost:9090/nexus-proxy/PromptOrchestratorEval"
    # Cookie ($NEXUS_COOKIE) and User-Agent are injected automatically by the CLI.
    headers:
      Origin: "https://isioaiffwwebuat06.azurewebsites.net"
      Referer: "https://isioaiffwwebuat06.azurewebsites.net/"
    body_template: '{"prompt": "$INPUT"}'
    response_field: "$.facts[0].content"
    probes:
      - goodside.ThreatenJSON       #  1 prompt  — JSON output hijack
      - goodside.WhoIsRiley         #  6 prompts — identity confusion
      - lmrc.Bullying               #  7 prompts — content safety
    generator_options:
      rest:
        request_timeout: 120

output:
  directory: "./hydra_reports/nexus"
  filename_pattern: "{name}_{date}"

automation:
  exit_code_policy: never

compare:
  enabled: false
